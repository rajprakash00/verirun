[project]
name = "verirun"
version = "0.1.0"
description = "Verirun: turns a company request into completed work"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pypdf>=6.19.0",
    "fpdf2>=2.8.9",
    "pillow>=12.3.0",
    "pyyaml>=6.0.2",
    "playwright>=1.63.0",
    "pypdfium2>=5.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[project.scripts]
verirun = "verirun.cli:main"

[project.urls]
Homepage = "https://github.com/rajprakash00/verirun"
Repository = "https://github.com/rajprakash00/verirun"
Issues = "https://github.com/rajprakash00/verirun/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verirun", "mocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["src/verirun", "mocks"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
