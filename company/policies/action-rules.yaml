id: action-rules
title: Permitted and forbidden actions
description: >-
  What Verirun may do, what it must never do, and what always needs a
  human yes.
rules:
  - id: no-payment-to-blocked-vendor
    description: Payments to a vendor marked blocked in LedgerLite are forbidden.
    effect: forbid
    actions:
      - payment.schedule
    when:
      - field: vendor_status
        op: eq
        value: blocked
  - id: no-payment-writes-outside-ledgerlite
    description: Payments may only be scheduled through LedgerLite.
    effect: forbid
    actions:
      - payment.schedule
    when:
      - field: system
        op: ne
        value: ledgerlite
