[project]
name = "operator"
version = "0.1.0"
description = "Operator: turns a company request into completed work"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pypdf>=6.19.0",
    "fpdf2>=2.8.9",
    "pillow>=12.3.0",
    "pyyaml>=6.0.2",
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
operator = "company_operator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_operator", "mocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
