<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}LedgerLite{% endblock %}</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #1d2433; }
    header { background: #1d2433; }
    nav { max-width: 1000px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    nav a { color: #cfd8e8; text-decoration: none; font-size: 0.92rem; }
    nav a:hover { color: #fff; }
    nav .brand { font-weight: 700; color: #fff; margin-right: 12px; }
    main { max-width: 1000px; margin: 24px auto 48px; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 2px rgba(29, 36, 51, 0.08); }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e7ee; font-size: 0.92rem; }
    th { background: #eef1f6; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: 0; }
    a { color: #2456a6; }
    .detail { background: #fff; padding: 16px; box-shadow: 0 1px 2px rgba(29, 36, 51, 0.08); display: grid; grid-template-columns: 200px 1fr; gap: 8px 16px; max-width: 720px; }
    .detail dt { color: #5c6a82; }
    .detail dd { margin: 0; }
    form.invoice { background: #fff; padding: 18px; display: grid; gap: 12px; max-width: 480px; box-shadow: 0 1px 2px rgba(29, 36, 51, 0.08); }
    label { display: grid; gap: 4px; font-size: 0.9rem; }
    input, select { padding: 8px; border: 1px solid #c6cedb; border-radius: 4px; font: inherit; }
    button { background: #1d2433; color: #fff; border: 0; padding: 10px 14px; border-radius: 4px; cursor: pointer; width: max-content; font: inherit; }
    .error { background: #fde8e8; border: 1px solid #f5b5b5; padding: 12px; border-radius: 4px; max-width: 560px; }
    .status-blocked { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="brand">LedgerLite</span>
      <a href="/">Dashboard</a>
      <a href="/invoices">Invoices</a>
      <a href="/vendors">Vendors</a>
      <a href="/purchase-orders">Purchase orders</a>
      <a href="/goods-receipts">Goods receipts</a>
      <a href="/payments">Payments</a>
      <a href="/approvals">Approvals</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
