<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Verirun{% endblock %}</title>
  <style>
    :root {
      --ink: #1c2333; --muted: #5b6577; --line: #dde3ec; --bg: #f5f7fb;
      --accent: #2f5dd1; --ok: #1c7c4a; --warn: #a86400; --bad: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      display: flex; gap: 24px; align-items: baseline;
      background: #fff; border-bottom: 1px solid var(--line); padding: 14px 24px;
    }
    header .brand { font-weight: 700; }
    header a { color: var(--ink); text-decoration: none; font-weight: 600; }
    header a:hover { color: var(--accent); }
    main { max-width: 1080px; margin: 24px auto; padding: 0 24px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
    .subtitle { color: var(--muted); margin: 0 0 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    tr:last-child td { border-bottom: none; }
    code { background: #eef1f7; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
    .state { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: #e8ecf5; }
    .state-completed { background: #e2f4e8; color: var(--ok); }
    .state-awaiting_approval { background: #fff1d6; color: var(--warn); }
    .state-needs_human, .state-failed, .state-limit_reached { background: #fde7e5; color: var(--bad); }
    .muted { color: var(--muted); font-size: 13px; }
    .error { color: var(--bad); }
    .steps { margin: 0; padding-left: 20px; }
    .steps li { margin-bottom: 8px; }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { border-left: 3px solid var(--line); margin-left: 6px; padding: 5px 0 10px 14px; }
    .timeline li.ok { border-color: #9fd3b4; }
    .timeline li.bad { border-color: #eab6b2; }
    .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .badge.ok { color: var(--ok); }
    .badge.bad { color: var(--bad); }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600;
      cursor: pointer; background: var(--accent); color: #fff;
    }
    button.reject { background: var(--bad); }
    input[type="text"] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 260px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Verirun</span>
    <a href="/">Runs</a>
    <a href="/approvals">Approvals</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
