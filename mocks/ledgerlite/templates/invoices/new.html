{% extends "base.html" %}
{% block title %}LedgerLite — New invoice{% endblock %}
{% block content %}
<h1>New invoice</h1>
<form class="invoice" method="post" action="/invoices">
  <label>Vendor invoice number
    <input type="text" name="number" required>
  </label>
  <label>Vendor
    <select name="vendor_id" required>
      {% for vendor in vendors %}
      <option value="{{ vendor.id }}">{{ vendor.id }} — {{ vendor.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Purchase order
    <select name="po_id">
      <option value="">none</option>
      {% for order in orders %}
      <option value="{{ order.id }}">{{ order.id }} — {{ order.vendor_id }} — {{ order.amount_cents | money }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Goods receipt
    <select name="gr_id">
      <option value="">none</option>
      {% for receipt in receipts %}
      <option value="{{ receipt.id }}">{{ receipt.id }} — {{ receipt.po_id }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Amount
    <input type="text" name="amount" inputmode="decimal" placeholder="1250.00" required>
  </label>
  <label>Currency
    <input type="text" name="currency" value="USD">
  </label>
  <button type="submit">File invoice</button>
</form>
{% if ui_variant %}
<script>
(() => {
  const variant = {{ ui_variant | tojson }};
  let changed = false;
  const relayout = () => {
    if (changed || !document.querySelector("[data-op-ref]")) return;
    changed = true;
    observer.disconnect();
    document.querySelectorAll("[data-op-ref]").forEach((el) => el.removeAttribute("data-op-ref"));
    const form = document.querySelector("form.invoice");
    const children = Array.from(form.children);
    for (const child of children.reverse()) form.appendChild(child);
    if (variant === "painted") {
      const button = form.querySelector("button[type=submit]");
      const painted = document.createElement("div");
      painted.id = "painted-submit";
      painted.textContent = button.textContent;
      painted.style.cssText =
        "background:#1d2433;color:#fff;padding:10px 14px;border-radius:4px;" +
        "cursor:pointer;width:max-content;font:inherit;";
      painted.addEventListener("click", () => {
        window.paintedClicks = (window.paintedClicks || 0) + 1;
        form.requestSubmit();
      });
      button.replaceWith(painted);
    }
    const back = document.createElement("a");
    back.href = "/invoices";
    back.textContent = "Back to invoices";
    form.prepend(back);
    window.uiChanged = true;
  };
  const observer = new MutationObserver(relayout);
  observer.observe(document.body, {
    attributes: true,
    subtree: true,
    attributeFilter: ["data-op-ref"],
  });
})();
</script>
{% endif %}
{% endblock %}
